<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(#4ec0ca, #b3e5fc);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    position: relative;
    width: 100%;
    max-width: 420px;
    text-align: center;
}

canvas {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    background: linear-gradient(#70c5ce, #d0f4f7);
    touch-action: none;
}

.title {
    color: white;
    font-size: 16px;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">TAP / CLICK / SPACE TO FLY</div>
    <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* 📱 Responsive canvas */
function resizeCanvas() {
    const scale = window.devicePixelRatio || 1;
    const width = Math.min(window.innerWidth * 0.95, 400);
    const height = Math.min(window.innerHeight * 0.75, 600);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    canvas.width = width * scale;
    canvas.height = height * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* 🐦 Bird */
let bird = {
    x: 80,
    y: 250,
    radius: 15,
    velocity: 0,
    gravity: 0.4,
    lift: -7
};

let pipes = [];
let gap = 170;
let frame = 0;
let score = 0;
let gameOver = false;

function drawBird() {
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD400";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(bird.x + 5, bird.y - 4, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#000";
    ctx.fill();
}

function drawPipes() {
    pipes.forEach(p => {
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(p.x, 0, 60, p.top);
        ctx.fillRect(p.x, p.bottom, 60, canvas.height);
    });
}

function updatePipes() {
    if (frame % 100 === 0) {
        let top = Math.random() * 220 + 40;
        pipes.push({
            x: canvas.width,
            top: top,
            bottom: top + gap,
            passed: false
        });
    }

    pipes.forEach(p => {
        p.x -= 1.5;

        if (!p.passed && p.x + 60 < bird.x) {
            score++;
            p.passed = true;
        }

        if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + 60 &&
            (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
        ) {
            gameOver = true;
        }
    });

    pipes = pipes.filter(p => p.x + 60 > 0);
}

function drawGround() {
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
}

function drawScore() {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px Arial";
    ctx.fillText("Score: " + score, 15, 30);
}

function drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 32px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2 - 100, canvas.height / 2 - 10);

    ctx.font = "16px Arial";
    ctx.fillText("Tap to Restart", canvas.width / 2 - 55, canvas.height / 2 + 25);
}

function resetGame() {
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    frame = 0;
    gameOver = false;
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    updatePipes();
    drawPipes();
    drawBird();
    drawGround();
    drawScore();

    if (bird.y + bird.radius > canvas.height - 40 || bird.y - bird.radius < 0) {
        gameOver = true;
    }

    if (gameOver) {
        drawGameOver();
        return;
    }

    frame++;
    requestAnimationFrame(update);
}

function flap() {
    if (!gameOver) {
        bird.velocity = bird.lift;
    } else {
        resetGame();
        update();
    }
}

document.addEventListener("keydown", e => {
    if (e.code === "Space") flap();
});

canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    flap();
});

resetGame();
update();
</script>

</body>
</html>
